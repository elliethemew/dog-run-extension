<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 200px;
            padding: 10px;
            font-family: sans-serif;
            text-align: center;
        }

        h3 {
            margin-top: 0;
        }

        button {
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button.active {
            background-color: #d1e7dd;
            border-color: #a3cfbb;
            color: #0f5132;
        }
    </style>
</head>

<body>
    <h3>Choose Character</h3>
    <button id="btn-dollar" data-char="dollar.gif">Dollar</button>
    <button id="btn-jingyuan" data-char="JingYuan.gif">Jing Yuan</button>
    <button id="btn-bluebinh" data-char="Bluebinh.gif">Bluebinh</button>
    <div style="margin-top: 10px; border-top: 1px solid #ccc; padding-top: 5px;">
        <button id="btn-off" data-char="none"
            style="background-color: #ffdce0; border-color: #f5c2c7; color: #842029;">Turn Off</button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
